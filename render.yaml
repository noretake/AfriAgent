services:
  - type: web
    name: afriagent-api
    runtime: node
    plan: free
    buildCommand: npm install && npm run build -w server
    startCommand: npm start -w server
    healthCheckPath: /api/health
    envVars:
      - key: NODE_ENV
        value: production
      - key: DEMO_MODE
        value: "true"
      - key: CLIENT_URL
        sync: false
